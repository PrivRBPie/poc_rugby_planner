name: Apply New Season Admin button move

on:
  push:
    branches: ["feature/new-season-button-admin"]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/new-season-button-admin
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Move button in source
        run: python scripts/move_new_season_button_to_admin.py
      - name: Commit source change
        run: |
          if git diff --quiet; then
            echo "No source changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx
          git commit -m "Move New Season button to Admin"
          git push origin HEAD:feature/new-season-button-admin
