name: R8 Dependency Audit

on:
  push:
    branches: ["stabilization/r8-foundation"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stabilization/r8-foundation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Refresh lockfile for declared dependency changes
        run: npm install --package-lock-only
      - run: npm ci
      - name: Apply non-breaking audit fixes
        run: npm audit fix || true
      - name: Validate after dependency fixes
        run: npm run check
      - name: Report remaining audit findings
        run: npm audit || true
      - name: Keep workflow out of generated commit
        run: git checkout HEAD -- .github/workflows/r8-dependency-audit.yml
      - name: Commit safe dependency updates when present
        run: |
          if git diff --quiet package.json package-lock.json; then
            echo "No safe dependency updates produced."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Apply safe dependency audit updates"
          git push origin stabilization/r8-foundation
