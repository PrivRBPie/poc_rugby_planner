name: Apply player move and season reset patch

on:
  push:
    branches: ["feature/player-move-season-reset"]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/player-move-season-reset
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply source patch
        run: |
          python scripts/apply_player_move_season_reset.py
          python scripts/fix_player_move_season_reset.py
      - name: Commit patched app
        run: |
          if git diff --quiet; then
            echo "No source changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx
          git commit -m "Finalize player move and season reset features"
          git push origin HEAD:feature/player-move-season-reset
