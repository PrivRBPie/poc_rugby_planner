name: Apply Advanced Actions and Save-state fix

on:
  push:
    branches: ["fix/advanced-actions-team-switch-save"]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/advanced-actions-team-switch-save
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply source patch
        run: python scripts/apply_advanced_actions_save_fix.py
      - name: Commit patched app
        run: |
          if git diff --quiet; then
            echo "No source changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx
          git commit -m "Redesign Advanced Actions and fix team switch dirty state"
          git push origin HEAD:fix/advanced-actions-team-switch-save
