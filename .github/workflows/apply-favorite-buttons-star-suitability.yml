name: Apply favorite-position and star-suitability UI

on:
  push:
    branches: ["feature/favorite-position-buttons-star-suitability"]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/favorite-position-buttons-star-suitability
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply source patch
        run: python scripts/apply_favorite_buttons_star_suitability.py
      - name: Commit patched source
        run: |
          if git diff --quiet; then
            echo "No source changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx src/domain/planner.ts
          git commit -m "Restore favorite-position buttons and simplify suitability ratings"
          git push origin HEAD:feature/favorite-position-buttons-star-suitability
