name: Apply playday availability patch

on:
  push:
    branches:
      - fix/playday-availability-eligibility
    paths:
      - scripts/apply_playday_availability.py
      - .github/workflows/apply-playday-availability.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/playday-availability-eligibility
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply patch
        run: python scripts/apply_playday_availability.py
      - name: Commit patched source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx
          git diff --cached --quiet || git commit -m "Enforce playday availability in lineup allocation"
          git push
