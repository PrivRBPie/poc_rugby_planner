name: Apply bench count consistency fix

on:
  push:
    branches: ["fix/bench-count-consistency"]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/bench-count-consistency
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply source patch
        run: python scripts/fix_bench_count_consistency.py
      - name: Commit patched source
        run: |
          if git diff --quiet; then
            echo "No source changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx
          git commit -m "Keep bench counts aligned with automatic bench"
          git push origin HEAD:fix/bench-count-consistency
