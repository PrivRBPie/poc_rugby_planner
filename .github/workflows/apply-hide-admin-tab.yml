name: Apply hide admin tab patch

on:
  push:
    branches:
      - fix/hide-admin-tab-for-coaches
    paths:
      - scripts/apply_hide_admin_tab.py
      - .github/workflows/apply-hide-admin-tab.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/hide-admin-tab-for-coaches
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply patch
        run: python scripts/apply_hide_admin_tab.py
      - name: Commit patched source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx src/AuthGate.jsx
          git diff --cached --quiet || git commit -m "Hide admin navigation from coach accounts"
          git push
