name: Complete R8 Domain Stabilization

on:
  push:
    branches: ["stabilization/r8-foundation"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  complete:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stabilization/r8-foundation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply final domain transformation
        run: |
          node scripts/fix-domain-generator.mjs
          node scripts/r8-domain-complete.mjs
      - name: Install dependencies
        run: npm ci
      - name: Validate final R8
        run: npm run check
      - name: Keep workflow file out of generated commit
        run: |
          git checkout HEAD -- .github/workflows/r8-domain-complete.yml
          rm -f scripts/r8-domain-complete.mjs scripts/fix-domain-generator.mjs
      - name: Commit final R8 domain changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete R8 planner domain and publish lifecycle"
          git push origin stabilization/r8-foundation
