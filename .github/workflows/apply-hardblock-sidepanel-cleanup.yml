name: Apply hard-block and side-panel cleanup

on:
  push:
    branches: ["feature/hardblock-sidepanel-cleanup"]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/hardblock-sidepanel-cleanup
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply source patch
        run: python scripts/apply_hardblock_sidepanel_cleanup.py
      - name: Commit patched source
        run: |
          if git diff --quiet; then
            echo "No source changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx
          git commit -m "Enforce position hard blocks and remove duplicate availability control"
          git push origin HEAD:feature/hardblock-sidepanel-cleanup
