name: Apply R8 Stabilization

on:
  push:
    branches: ["stabilization/r8-foundation"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stabilize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stabilization/r8-foundation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply source transformations
        run: node scripts/stabilize-r8.mjs
      - name: Refresh lockfile
        run: npm install --package-lock-only
      - name: Install dependencies
        run: npm ci
      - name: Validate stabilization
        run: npm run check
      - name: Remove bootstrap automation
        run: rm -f scripts/stabilize-r8.mjs .github/workflows/stabilize-r8.yml
      - name: Commit stabilized source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Stabilize planner foundation for R8"
          git push origin stabilization/r8-foundation
