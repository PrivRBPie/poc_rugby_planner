name: Fix shared note helper

on:
  push:
    branches: ["feature/shared-notes-simplified-status"]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/shared-notes-simplified-status
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply helper fix
        run: python scripts/fix_shared_note_helper.py
      - name: Commit fixed source
        run: |
          if git diff --quiet; then
            echo "No source changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx
          git commit -m "Fix shared coach note rendering"
          git push origin HEAD:feature/shared-notes-simplified-status
